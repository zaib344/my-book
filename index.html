<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Library</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="books.css">
</head>
<body>
    <div class="container-fluid library">
      <p id="recommendation-result" class="recommendation"></p>
        <header class="text-center">
            <p class="eyebrow">A PERSONAL ARCHIVE</p>
            <h1>Welcome to my library</h1>
            <div class="library-info">
                <span id="book-count">0 VOLUMES</span>
                <button id="recommend-btn" type="button">RECOMMEND A BOOK</button>
            </div>
        </header>

        <section class="search-section text-center">
            <input type="text" id="search-input" placeholder="What are you looking for?" autocomplete="off">
            <div class="filters">
                <button class="filter active" data-genre="All" type="button">ALL</button>
                <button class="filter" data-genre="Romance" type="button">ROMANCE</button>
                <button class="filter" data-genre="Fantasy" type="button">FANTASY</button>
                <button class="filter" data-genre="Mystery" type="button">MYSTERY</button>
                <button class="filter" data-genre="Fiction" type="button">FICTION</button>
            </div>
        </section>

        <main class="bookshelf-section" id="bookshelf" aria-live="polite"></main>

        <footer class="text-center">
            <p>MADE WITH LOVE &amp; A LITTLE TOO MUCH BOOK OBSESSION.</p>
        </footer>
    </div>

    <script src="books.js"></script>
</body>
</html>
